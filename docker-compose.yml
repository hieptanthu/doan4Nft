version: "3"
services:
  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"  # Chuyển tiếp cổng 80 từ máy chủ vào Nginx container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Mount file cấu hình nginx từ máy chủ vào container
    networks:
      - app_network  # Đảm bảo rằng nginx và app ở cùng một mạng Docker

  websocket:
    build:
      context: ./websocket  # Dự án WebSocket ở thư mục ./websocket
    container_name: websocket-app
    ports:
      - "5001:5001"
    networks:
      - app_network

  app:
    build:
      context: ./fe  # Dự án Next.js ở thư mục ./fe
    container_name: blokchain-app  # Đảm bảo rằng tên này là đúng
    ports:
      - "3000:3000"
    depends_on:
      - websocket  # Đảm bảo rằng dịch vụ websocket khởi động trước
    networks:
      - app_network
    
networks:
  app_network:
    driver: bridge  # Sử dụng driver bridge để tạo mạng Docker nội bộ giữa các container