version: "3"
services:
  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"  # Chuyển tiếp cổng 80 từ máy chủ vào Nginx container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Mount file cấu hình nginx từ máy chủ vào container
    networks:
      - app_network  # Đảm bảo rằng nginx và app ở cùng một mạng Docker

  app:
    build:
      context: ./fe  # Dự án Next.js ở thư mục ./fe
    container_name: app
    ports:
      - "3000:3000"  # Chuyển tiếp cổng 3000 cho ứng dụng Next.js
    networks:
      - app_network  # Kết nối ứng dụng vào mạng Docker
    environment:
      - REDIS_HOST=redis  # Cấu hình tên host Redis trong mạng Docker (dùng dịch vụ Redis trong docker-compose.yml)

  redis:
    image: redis:latest  # Sử dụng image chính thức của Redis
    container_name: redis-container
    ports:
      - "6379:6379"  # Chuyển tiếp cổng Redis vào container (mặc định Redis sử dụng cổng 6379)
    networks:
      - app_network  # Kết nối Redis vào cùng mạng với các dịch vụ khác

networks:
  app_network:
    driver: bridge  # Sử dụng driver bridge để tạo mạng Docker nội bộ giữa các container
