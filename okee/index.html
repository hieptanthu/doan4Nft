<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO Test</title>
  <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
</head>
<body>
  <h1>Socket.IO Chat</h1>

  <!-- Input to send message -->
  <input type="text" id="messageInput" placeholder="Type your message..." />
  <button onclick="sendMessage()">Send</button>

  <!-- Display chat messages -->
  <div id="chatMessages" style="height: 80px; overflow-y: scroll;">
    <!-- Messages will appear here -->
  </div>

  <script>
    const socket = io("http://localhost:5001", {
      query: {
        userid: "user123" // Thay thế user123 bằng ID người dùng thực tế
      }
    });

    const room = "room1"; // Thay đổi tên phòng nếu cần
    let lastMessageIndex = -1; // Chỉ số của tin nhắn gần nhất đã tải

    socket.on("chatHistory", (messages) => {
      const chatMessages = document.getElementById("chatMessages");
      // Thêm tin nhắn vào đầu danh sách (ngược lại với thứ tự cũ)
      messages.forEach(message => {
        const messageElement = document.createElement("div");
        messageElement.textContent = message;
        chatMessages.prepend(messageElement);
      });
    });

    socket.on("receiveMessage", (message) => {
      const chatMessages = document.getElementById("chatMessages");
      const messageElement = document.createElement("div");
      messageElement.textContent = message;
      chatMessages.appendChild(messageElement);
    });

    function sendMessage() {
      const messageInput = document.getElementById("messageInput");
      const message = messageInput.value;

      if (message.trim()) {
        socket.emit("sendMessage", { room, message });
        messageInput.value = ""; // Clear input field
      }
    }

    // Gia nhập phòng khi trang được tải
    socket.emit("joinRoomProduct", room);

    // Lắng nghe sự kiện cuộn
    document.getElementById("chatMessages").addEventListener('scroll', function () {
      const chatMessages = document.getElementById("chatMessages");

      if (chatMessages.scrollTop === 0) {
        // Người dùng cuộn lên đầu, yêu cầu thêm tin nhắn
        loadMoreMessages();
      }
    });

    // Lấy thêm tin nhắn khi người dùng cuộn lên
    function loadMoreMessages() {
      // Gửi yêu cầu để lấy thêm tin nhắn
      socket.emit("loadMoreMessages", { room, lastMessageIndex });
    }

  </script>
</body>
</html>
